<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeputatikTXT</title>
    <meta name="description" content="Минималистичный текстовый редактор для работы с .txt файлами." />
    <meta property="og:title" content="DeputatikTXT" />
    <meta property="og:description" content="Минималистичный текстовый редактор для работы с .txt файлами." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-canvas: #f8fafc;
        --bg-header: #ffffff;
        --bg-surface: #ffffff;
        --bg-input: #f8fafc;
        --bg-btn: #f1f5f9;
        --bg-btn-hover: #e2e8f0;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --border-color: #e2e8f0;
        --border-subtle: #cbd5e1;
        --accent: #2563eb;
        --accent-hover: #3b82f6;
        --danger-hover: #e11d48;
      }

      html[data-theme="dark"] {
        --bg-canvas: #090d16;
        --bg-header: #0d1320;
        --bg-surface: #111827;
        --bg-input: #090d16;
        --bg-btn: #1e293b;
        --bg-btn-hover: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border-color: #1e293b;
        --border-subtle: #334155;
        --accent: #2563eb;
        --accent-hover: #3b82f6;
        --danger-hover: #fb7185;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .app-shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* Шапка */
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
        padding: 0.875rem 1.5rem;
        background-color: var(--bg-header);
        border-bottom: 1px solid var(--border-color);
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }

      .brand-title {
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        white-space: nowrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.5rem 0.875rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border-subtle);
        background-color: var(--bg-btn);
        color: var(--text-primary);
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      }

      .btn:hover:not(:disabled) {
        background-color: var(--bg-btn-hover);
      }

      .btn:active:not(:disabled) {
        transform: scale(0.98);
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-primary {
        background-color: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        background-color: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      .btn-icon {
        padding: 0.45rem;
      }

      .icon-svg {
        width: 1rem;
        height: 1rem;
        flex-shrink: 0;
      }

      /* Основная область */
      .app-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 64rem;
        margin: 0 auto;
        padding: 1.25rem 1.5rem;
        gap: 0.75rem;
        min-height: 0;
      }

      .top-controls-row {
        display: flex;
        align-items: stretch;
        gap: 0.625rem;
      }

      .filename-box {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.5rem 0.875rem;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
        transition: border-color 0.15s ease;
      }

      .filename-box:focus-within {
        border-color: var(--accent);
      }

      .filename-left {
        display: flex;
        align-items: center;
        gap: 0.625rem;
        flex: 1;
        min-width: 0;
      }

      .filename-input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 500;
      }

      .filename-input::placeholder {
        color: var(--text-muted);
      }

      .filename-right {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }

      .ext-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
        color: var(--text-muted);
        user-select: none;
      }

      .clear-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        padding: 0.35rem;
        border-radius: 0.5rem;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
      }

      .clear-btn.visible {
        display: inline-flex;
      }

      .clear-btn:hover {
        color: var(--danger-hover);
        background-color: var(--bg-btn);
      }

      .toolbar-box {
        display: flex;
        align-items: center;
        padding: 0.375rem;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
        flex-shrink: 0;
      }

      .toolbar-btn {
        border: none;
        background: transparent;
        color: var(--text-secondary);
        padding: 0.4rem 0.85rem;
        border-radius: 0.5rem;
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .toolbar-btn:hover {
        background-color: var(--bg-btn);
        color: var(--text-primary);
      }

      .toolbar-btn.active {
        background-color: var(--accent);
        color: #ffffff;
      }

      /* Панель поиска и замены */
      .search-panel {
        display: none;
        flex-direction: column;
        gap: 0.625rem;
        padding: 0.75rem;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
      }

      .search-panel.open {
        display: flex;
      }

      .search-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }

      .search-input-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.75rem;
        background-color: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        min-width: 180px;
      }

      .search-input-wrap:focus-within {
        border-color: var(--accent);
      }

      .search-field {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.85rem;
      }

      .match-counter {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: var(--text-secondary);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .search-actions {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      .replace-row {
        display: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }

      .replace-row.open {
        display: flex;
      }

      /* Основное текстовое поле */
      .editor-box {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
        overflow: hidden;
        min-height: 55dvh;
        transition: border-color 0.15s ease;
      }

      .editor-box:focus-within {
        border-color: var(--accent);
      }

      .editor-textarea {
        flex: 1;
        width: 100%;
        padding: 1.25rem 1.5rem;
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        color: var(--text-primary);
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        line-height: 1.65;
        overflow-y: auto;
        white-space: pre-wrap;
      }

      .editor-textarea.nowrap {
        white-space: pre;
        overflow-x: auto;
      }

      .editor-textarea::placeholder {
        color: var(--text-muted);
      }

      /* Подвал */
      .app-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
      }

      .stats-bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        flex-wrap: wrap;
      }

      .stats-bar strong {
        color: var(--text-primary);
        font-weight: 600;
      }

      .toast-msg {
        color: #3b82f6;
        font-weight: 600;
      }

      .footer-buttons {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }

      .footer-buttons .btn {
        padding: 0.625rem 1.125rem;
      }

      /* Модальное окно настроек */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background-color: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal-card {
        width: 100%;
        max-width: 28rem;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 1rem;
        padding: 1.375rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
      }

      .modal-title {
        font-size: 1.05rem;
        font-weight: 700;
      }

      .modal-body {
        padding: 1.25rem 0;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .setting-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .setting-label {
        font-size: 0.875rem;
        font-weight: 600;
      }

      .setting-desc {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-top: 0.15rem;
      }

      .size-group {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      .size-btn {
        padding: 0.375rem 0.625rem;
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: 0.5rem;
        border: 1px solid var(--border-color);
        background-color: var(--bg-btn);
        color: var(--text-primary);
        cursor: pointer;
      }

      .size-btn.active {
        background-color: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .modal-footer {
        padding-top: 0.875rem;
        border-top: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Печать */
      .print-only {
        display: none;
      }

      @media print {
        body {
          background: #ffffff !important;
          color: #000000 !important;
        }
        .app-shell {
          display: none !important;
        }
        .print-only {
          display: block !important;
          padding: 2rem;
          color: #000000;
          background: #ffffff;
        }
        .print-title {
          font-size: 1.125rem;
          font-weight: 700;
          margin-bottom: 1rem;
          padding-bottom: 0.5rem;
          border-bottom: 1px solid #cbd5e1;
        }
        .print-content {
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.875rem;
          white-space: pre-wrap;
          word-break: break-word;
          line-height: 1.6;
        }
      }

      /* Мобильная адаптивность */
      @media (max-width: 640px) {
        .app-header {
          padding: 0.75rem 1rem;
        }
        .app-main {
          padding: 0.75rem;
        }
        .top-controls-row {
          flex-direction: column;
        }
        .toolbar-box {
          justify-content: stretch;
        }
        .toolbar-btn {
          flex: 1;
          justify-content: center;
        }
        .app-footer {
          flex-direction: column;
          align-items: stretch;
        }
        .footer-buttons {
          width: 100%;
        }
        .footer-buttons .btn {
          flex: 1;
        }
        .editor-textarea {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-shell">
        <!-- Шапка приложения -->
        <header class="app-header">
          <span class="brand-title">DeputatikTXT</span>
          <div>
            <button type="button" id="openSettingsBtn" class="btn" aria-label="Настройки">
              <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <span>Настройки</span>
            </button>
          </div>
        </header>

        <!-- Основная рабочая область -->
        <main class="app-main">
          <!-- Поле названия файла + кнопка Найти -->
          <div class="top-controls-row">
            <div class="filename-box">
              <div class="filename-left">
                <svg class="icon-svg" style="color: var(--text-muted);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
                  <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
                  <path d="M10 9H8"/>
                  <path d="M16 13H8"/>
                  <path d="M16 17H8"/>
                </svg>
                <input
                  type="text"
                  id="fileNameInput"
                  class="filename-input"
                  placeholder="Введите название файла..."
                  aria-label="Название файла"
                  spellcheck="false"
                  autocomplete="off"
                />
              </div>
              <div class="filename-right">
                <span class="ext-label">.txt</span>
                <button type="button" id="clearEditorBtn" class="clear-btn" title="Очистить редактор">
                  <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="toolbar-box">
              <button type="button" id="toggleSearchBtn" class="toolbar-btn">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"/>
                  <path d="m21 21-4.3-4.3"/>
                </svg>
                <span>Найти</span>
              </button>
            </div>
          </div>

          <!-- Панель поиска и замены -->
          <div id="searchPanel" class="search-panel">
            <div class="search-row">
              <div class="search-input-wrap">
                <svg class="icon-svg" style="color: var(--text-muted);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"/>
                  <path d="m21 21-4.3-4.3"/>
                </svg>
                <input type="text" id="searchInput" class="search-field" placeholder="Найти в тексте..." />
                <span id="matchCounter" class="match-counter"></span>
              </div>

              <div class="search-actions">
                <button type="button" id="caseSensitiveBtn" class="btn btn-icon" title="Учитывать регистр">
                  <span style="font-size: 0.75rem; font-weight: 700; padding: 0 2px;">Aa</span>
                </button>
                <button type="button" id="prevMatchBtn" class="btn btn-icon" title="Предыдущее совпадение" disabled>
                  <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m18 15-6-6-6 6"/>
                  </svg>
                </button>
                <button type="button" id="nextMatchBtn" class="btn btn-icon" title="Следующее совпадение" disabled>
                  <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6"/>
                  </svg>
                </button>
                <button type="button" id="toggleReplaceRowBtn" class="btn" style="padding: 0.4rem 0.65rem; font-size: 0.75rem;">
                  Замена
                </button>
                <button type="button" id="closeSearchBtn" class="btn btn-icon" title="Закрыть панель поиска" style="border: none; background: transparent;">
                  <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"/>
                    <path d="m6 6 12 12"/>
                  </svg>
                </button>
              </div>
            </div>

            <div id="replaceRow" class="replace-row">
              <div class="search-input-wrap">
                <input type="text" id="replaceInput" class="search-field" placeholder="Заменить на..." />
              </div>
              <div class="search-actions">
                <button type="button" id="replaceOneBtn" class="btn" style="padding: 0.4rem 0.75rem; font-size: 0.75rem;" disabled>
                  Заменить
                </button>
                <button type="button" id="replaceAllBtn" class="btn btn-primary" style="padding: 0.4rem 0.75rem; font-size: 0.75rem;" disabled>
                  Заменить все
                </button>
              </div>
            </div>
          </div>

          <!-- Основная текстовая область -->
          <div class="editor-box">
            <textarea
              id="textEditor"
              class="editor-textarea"
              placeholder="Введите текст..."
              aria-label="Содержимое текстового файла"
            ></textarea>
          </div>

          <!-- Нижняя панель с кнопками "Открыть файл" и "Скачать" -->
          <footer class="app-footer">
            <div class="stats-bar">
              <span>Строк: <strong id="lineCount">1</strong></span>
              <span>·</span>
              <span>Слов: <strong id="wordCount">0</strong></span>
              <span>·</span>
              <span>Символов: <strong id="charCount">0</strong></span>
              <span id="toastSeparator" style="display: none;">·</span>
              <span id="toastMessage" class="toast-msg"></span>
            </div>

            <input type="file" id="fileInput" accept=".txt,text/plain" style="display: none;" />

            <div class="footer-buttons">
              <button type="button" id="openFileBtn" class="btn">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>
                </svg>
                <span>Открыть файл</span>
              </button>

              <button type="button" id="downloadFileBtn" class="btn btn-primary">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" x2="12" y1="15" y2="3"/>
                </svg>
                <span>Скачать</span>
              </button>
            </div>
          </footer>
        </main>

        <!-- Модальное окно настроек -->
        <div id="settingsModal" class="modal-backdrop">
          <div class="modal-card" id="settingsCard">
            <div class="modal-header">
              <h2 class="modal-title">Настройки</h2>
              <button type="button" id="closeSettingsBtn" class="btn btn-icon" style="border: none; background: transparent;" aria-label="Закрыть настройки">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 6 6 18"/>
                  <path d="m6 6 12 12"/>
                </svg>
              </button>
            </div>

            <div class="modal-body">
              <div class="setting-item">
                <div>
                  <div class="setting-label">Тема оформления</div>
                  <div class="setting-desc">Переключение между темным и светлым режимом</div>
                </div>
                <button type="button" id="themeToggleBtn" class="btn">
                  <span id="themeToggleLabel">Темная</span>
                </button>
              </div>

              <div class="setting-item">
                <div>
                  <div class="setting-label">Размер текста</div>
                  <div class="setting-desc" id="fontSizeDesc">Текущий размер: 15 px</div>
                </div>
                <div class="size-group" id="fontSizeGroup">
                  <button type="button" class="size-btn" data-size="13">13</button>
                  <button type="button" class="size-btn active" data-size="15">15</button>
                  <button type="button" class="size-btn" data-size="18">18</button>
                  <button type="button" class="size-btn" data-size="20">20</button>
                </div>
              </div>

              <div class="setting-item">
                <div>
                  <div class="setting-label">Перенос строк</div>
                  <div class="setting-desc">Автоматический перенос длинных строк</div>
                </div>
                <button type="button" id="wordWrapBtn" class="btn btn-primary">
                  Включен
                </button>
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" id="printDocBtn" class="btn">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 6 2 18 2 18 9"/>
                  <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                  <rect width="12" height="8" x="6" y="14"/>
                </svg>
                <span>Печать</span>
              </button>
              <button type="button" id="doneSettingsBtn" class="btn btn-primary">
                Готово
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Контейнер для печати -->
      <div class="print-only">
        <h1 class="print-title" id="printTitle">document.txt</h1>
        <pre class="print-content" id="printContent"></pre>
      </div>
    </div>

    <script>
      (function () {
        const htmlEl = document.documentElement;
        const fileNameInput = document.getElementById('fileNameInput');
        const textEditor = document.getElementById('textEditor');
        const clearEditorBtn = document.getElementById('clearEditorBtn');
        const fileInput = document.getElementById('fileInput');
        const openFileBtn = document.getElementById('openFileBtn');
        const downloadFileBtn = document.getElementById('downloadFileBtn');

        const lineCountEl = document.getElementById('lineCount');
        const wordCountEl = document.getElementById('wordCount');
        const charCountEl = document.getElementById('charCount');
        const toastSeparator = document.getElementById('toastSeparator');
        const toastMessage = document.getElementById('toastMessage');

        // Поиск и замена
        const toggleSearchBtn = document.getElementById('toggleSearchBtn');
        const searchPanel = document.getElementById('searchPanel');
        const searchInput = document.getElementById('searchInput');
        const matchCounter = document.getElementById('matchCounter');
        const caseSensitiveBtn = document.getElementById('caseSensitiveBtn');
        const prevMatchBtn = document.getElementById('prevMatchBtn');
        const nextMatchBtn = document.getElementById('nextMatchBtn');
        const toggleReplaceRowBtn = document.getElementById('toggleReplaceRowBtn');
        const closeSearchBtn = document.getElementById('closeSearchBtn');
        const replaceRow = document.getElementById('replaceRow');
        const replaceInput = document.getElementById('replaceInput');
        const replaceOneBtn = document.getElementById('replaceOneBtn');
        const replaceAllBtn = document.getElementById('replaceAllBtn');

        // Настройки
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const settingsCard = document.getElementById('settingsCard');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const doneSettingsBtn = document.getElementById('doneSettingsBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeToggleLabel = document.getElementById('themeToggleLabel');
        const fontSizeDesc = document.getElementById('fontSizeDesc');
        const fontSizeGroup = document.getElementById('fontSizeGroup');
        const wordWrapBtn = document.getElementById('wordWrapBtn');
        const printDocBtn = document.getElementById('printDocBtn');

        // Печать
        const printTitle = document.getElementById('printTitle');
        const printContent = document.getElementById('printContent');

        let isDark = true;
        let fontSize = 15;
        let wordWrap = true;
        let caseSensitive = false;
        let matches = [];
        let currentMatchIndex = 0;
        let toastTimer = null;

        function showToast(msg) {
          toastMessage.textContent = msg;
          toastSeparator.style.display = 'inline';
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toastMessage.textContent = '';
            toastSeparator.style.display = 'none';
          }, 2500);
        }

        function updateStatsAndClearBtn() {
          const text = textEditor.value;
          const chars = text.length;
          const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
          const lines = text === '' ? 1 : text.split(/\r\n|\r|\n/).length;

          charCountEl.textContent = String(chars);
          wordCountEl.textContent = String(words);
          lineCountEl.textContent = String(lines);

          if (text.length > 0 || fileNameInput.value.length > 0) {
            clearEditorBtn.classList.add('visible');
          } else {
            clearEditorBtn.classList.remove('visible');
          }

          printTitle.textContent = (fileNameInput.value.trim().replace(/\.txt$/i, '') || 'document') + '.txt';
          printContent.textContent = text;
        }

        function computeMatches() {
          const query = searchInput.value;
          const content = textEditor.value;
          matches = [];

          if (!query) {
            matchCounter.textContent = '';
            prevMatchBtn.disabled = true;
            nextMatchBtn.disabled = true;
            replaceOneBtn.disabled = true;
            replaceAllBtn.disabled = true;
            return;
          }

          const source = caseSensitive ? content : content.toLowerCase();
          const target = caseSensitive ? query : query.toLowerCase();

          let pos = 0;
          while (pos <= source.length - target.length) {
            const idx = source.indexOf(target, pos);
            if (idx === -1) break;
            matches.push(idx);
            pos = idx + Math.max(1, target.length);
          }

          if (currentMatchIndex >= matches.length) {
            currentMatchIndex = 0;
          }

          if (matches.length > 0) {
            matchCounter.textContent = (currentMatchIndex + 1) + ' / ' + matches.length;
            prevMatchBtn.disabled = false;
            nextMatchBtn.disabled = false;
            replaceOneBtn.disabled = false;
            replaceAllBtn.disabled = false;
          } else {
            matchCounter.textContent = '0 / 0';
            prevMatchBtn.disabled = true;
            nextMatchBtn.disabled = true;
            replaceOneBtn.disabled = true;
            replaceAllBtn.disabled = true;
          }
        }

        function focusMatch(idx) {
          if (matches.length === 0) return;
          const start = matches[idx];
          if (start === undefined) return;
          const end = start + searchInput.value.length;

          textEditor.focus();
          textEditor.setSelectionRange(start, end);

          const textBefore = textEditor.value.slice(0, start);
          const linesBefore = textBefore.split(/\r\n|\r|\n/).length - 1;
          const approxLineHeight = fontSize * 1.65;
          textEditor.scrollTop = Math.max(0, linesBefore * approxLineHeight - textEditor.clientHeight / 3);
        }

        // События ввода текста
        textEditor.addEventListener('input', () => {
          const isAtEnd = textEditor.selectionStart >= textEditor.value.length - 2;
          updateStatsAndClearBtn();
          computeMatches();
          if (isAtEnd) {
            textEditor.scrollTop = textEditor.scrollHeight;
          }
        });

        fileNameInput.addEventListener('input', updateStatsAndClearBtn);

        clearEditorBtn.addEventListener('click', () => {
          textEditor.value = '';
          fileNameInput.value = '';
          updateStatsAndClearBtn();
          computeMatches();
          showToast('Очищено');
          textEditor.focus();
        });

        // Открытие файла через FileReader
        openFileBtn.addEventListener('click', () => {
          fileInput.value = '';
          fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            const result = event.target ? event.target.result : '';
            textEditor.value = typeof result === 'string' ? result : '';
            fileNameInput.value = file.name.replace(/\.txt$/i, '');
            updateStatsAndClearBtn();
            computeMatches();
            showToast('Открыт файл «' + file.name + '»');
            textEditor.scrollTop = textEditor.scrollHeight;
            textEditor.focus();
          };
          reader.onerror = () => {
            showToast('Ошибка при чтении файла');
          };
          reader.readAsText(file, 'UTF-8');
        });

        // Скачивание .txt файла через Blob
        function downloadTxtFile() {
          const cleanName = fileNameInput.value.trim().replace(/\.txt$/i, '') || 'document';
          const finalFileName = cleanName + '.txt';
          const blob = new Blob([textEditor.value], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);

          const link = document.createElement('a');
          link.href = url;
          link.download = finalFileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);

          showToast('Сохранен «' + finalFileName + '»');
        }

        downloadFileBtn.addEventListener('click', downloadTxtFile);

        // Поиск и замена
        toggleSearchBtn.addEventListener('click', () => {
          const isOpen = searchPanel.classList.toggle('open');
          toggleSearchBtn.classList.toggle('active', isOpen);
          if (isOpen) {
            searchInput.focus();
            searchInput.select();
            computeMatches();
          }
        });

        closeSearchBtn.addEventListener('click', () => {
          searchPanel.classList.remove('open');
          toggleSearchBtn.classList.remove('active');
        });

        toggleReplaceRowBtn.addEventListener('click', () => {
          const isReplaceOpen = replaceRow.classList.toggle('open');
          toggleReplaceRowBtn.classList.toggle('btn-primary', isReplaceOpen);
        });

        searchInput.addEventListener('input', () => {
          currentMatchIndex = 0;
          computeMatches();
        });

        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (matches.length === 0) return;
            if (e.shiftKey) {
              currentMatchIndex = (currentMatchIndex - 1 + matches.length) % matches.length;
            } else {
              currentMatchIndex = (currentMatchIndex + 1) % matches.length;
            }
            computeMatches();
            focusMatch(currentMatchIndex);
          }
        });

        caseSensitiveBtn.addEventListener('click', () => {
          caseSensitive = !caseSensitive;
          caseSensitiveBtn.classList.toggle('btn-primary', caseSensitive);
          currentMatchIndex = 0;
          computeMatches();
        });

        prevMatchBtn.addEventListener('click', () => {
          if (matches.length === 0) return;
          currentMatchIndex = (currentMatchIndex - 1 + matches.length) % matches.length;
          computeMatches();
          focusMatch(currentMatchIndex);
        });

        nextMatchBtn.addEventListener('click', () => {
          if (matches.length === 0) return;
          currentMatchIndex = (currentMatchIndex + 1) % matches.length;
          computeMatches();
          focusMatch(currentMatchIndex);
        });

        replaceOneBtn.addEventListener('click', () => {
          if (matches.length === 0 || !searchInput.value) return;
          const start = matches[currentMatchIndex] !== undefined ? matches[currentMatchIndex] : matches[0];
          const end = start + searchInput.value.length;
          const replacement = replaceInput.value;

          textEditor.value = textEditor.value.slice(0, start) + replacement + textEditor.value.slice(end);
          updateStatsAndClearBtn();
          computeMatches();
          showToast('Заменено 1 совпадение');
        });

        replaceAllBtn.addEventListener('click', () => {
          if (matches.length === 0 || !searchInput.value) return;
          const count = matches.length;
          const escaped = searchInput.value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(escaped, caseSensitive ? 'g' : 'gi');
          textEditor.value = textEditor.value.replace(regex, () => replaceInput.value);
          currentMatchIndex = 0;
          updateStatsAndClearBtn();
          computeMatches();
          showToast('Заменено совпадений: ' + count);
        });

        // Настройки
        openSettingsBtn.addEventListener('click', () => {
          settingsModal.classList.add('open');
        });

        function closeSettings() {
          settingsModal.classList.remove('open');
        }

        closeSettingsBtn.addEventListener('click', closeSettings);
        doneSettingsBtn.addEventListener('click', closeSettings);
        settingsModal.addEventListener('click', (e) => {
          if (e.target === settingsModal) closeSettings();
        });

        themeToggleBtn.addEventListener('click', () => {
          isDark = !isDark;
          htmlEl.setAttribute('data-theme', isDark ? 'dark' : 'light');
          themeToggleLabel.textContent = isDark ? 'Темная' : 'Светлая';
        });

        fontSizeGroup.addEventListener('click', (e) => {
          const btn = e.target.closest('.size-btn');
          if (!btn) return;
          fontSize = Number(btn.getAttribute('data-size'));
          textEditor.style.fontSize = fontSize + 'px';
          fontSizeDesc.textContent = 'Текущий размер: ' + fontSize + ' px';
          fontSizeGroup.querySelectorAll('.size-btn').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
        });

        wordWrapBtn.addEventListener('click', () => {
          wordWrap = !wordWrap;
          textEditor.classList.toggle('nowrap', !wordWrap);
          textEditor.setAttribute('wrap', wordWrap ? 'soft' : 'off');
          wordWrapBtn.textContent = wordWrap ? 'Включен' : 'Выключен';
          wordWrapBtn.classList.toggle('btn-primary', wordWrap);
        });

        printDocBtn.addEventListener('click', () => {
          closeSettings();
          updateStatsAndClearBtn();
          window.print();
        });

        // Горячие клавиши
        window.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            e.preventDefault();
            downloadTxtFile();
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
            e.preventDefault();
            fileInput.value = '';
            fileInput.click();
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
            e.preventDefault();
            searchPanel.classList.add('open');
            toggleSearchBtn.classList.add('active');
            searchInput.focus();
            searchInput.select();
            computeMatches();
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'h') {
            e.preventDefault();
            searchPanel.classList.add('open');
            toggleSearchBtn.classList.add('active');
            replaceRow.classList.add('open');
            toggleReplaceRowBtn.classList.add('btn-primary');
            searchInput.focus();
            searchInput.select();
            computeMatches();
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
            e.preventDefault();
            updateStatsAndClearBtn();
            window.print();
          } else if (e.key === 'Escape') {
            if (settingsModal.classList.contains('open')) {
              closeSettings();
            } else if (searchPanel.classList.contains('open')) {
              searchPanel.classList.remove('open');
              toggleSearchBtn.classList.remove('active');
            }
          }
        });

        updateStatsAndClearBtn();
      })();
    </script>
  </body>
</html>
